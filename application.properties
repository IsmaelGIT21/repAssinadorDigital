# Local secrets live in .env (git-ignored; copy .env.example). Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

server.servlet.context-path=/assinador-utfpr-teste
server.port=8099

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# External PKCS#12 signing authority. Never commit the referenced file or password.
certificate.path=${CERTIFICATE_PATH:./secrets/certificado.p12}
certificate.password=${CERTIFICATE_PASSWORD:}
certificate.common_name=${CERTIFICATE_COMMON_NAME:Digital Signature Platform}
# Derived-certificate validity time in minutes.
certificate.validity_time=${CERTIFICATE_VALIDITY_TIME:1440}
certificate.location=${CERTIFICATE_LOCATION:BR}
# Optional RFC 3161 time-stamp authority (e.g. https://freetsa.org/tsr). Empty = no time stamp.
certificate.tsa_url=${CERTIFICATE_TSA_URL:}

# MongoDB
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:digital-signature}
#spring.data.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:admin}
#spring.data.mongodb.username=${MONGODB_USERNAME:}
#spring.data.mongodb.password=${MONGODB_PASSWORD:}

# Logging
logging.level.br.edu.utfpr.td.tsi.projeto_assinador=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# SMTP
spring.mail.host=${MAIL_HOST:smtp.utfpr.edu.br}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application
app.name=${APP_NAME:Digital Signature Platform}
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.jackson.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
# In-memory login used while there is no user registration. Both values are required.
app.usuario-teste.email=${APP_TEST_USER_EMAIL:}
app.usuario-teste.senha=${APP_TEST_USER_PASSWORD:}

# ICP-Brasil trust-store cache
icp-brasil.cache-dir=${ICP_BRASIL_CACHE_DIR:.cache/icp-brasil}