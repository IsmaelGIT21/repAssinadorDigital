<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Public layout (topbar, no sidebar, no auth required) -->
<body th:fragment="page(pageTitle, content)">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: { DEFAULT: '#E5A100', hover: '#CC8F00', light: '#FFF8E7' },
                dark: { DEFAULT: '#1a1a1a', light: '#2d2d2d', muted: '#4a4a4a' },
                surface: '#f5f5f0',
                border: '#e5e5e0',
            }
        }
    }
}
</script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<link th:href="@{/css/style.css}" rel="stylesheet">

<div class="min-h-screen bg-surface">

    <div class="bg-dark px-8 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-white rounded-md p-1">
                <img th:src="@{/images/utfpr_logo.png}" alt="UTFPR" class="h-7">
            </div>
            <span class="text-primary font-semibold text-sm uppercase tracking-wider">Assinador Digital</span>
        </div>
        <div>
            <a th:href="@{/login}" th:if="${session.userName == null}" class="btn btn-outline btn-sm !text-white/80 !border-white/20 hover:!bg-white/10 hover:!text-white hover:!border-white/40 no-underline">
                <i class="ph ph-sign-in"></i> Entrar
            </a>
            <a th:href="@{/documents}" th:if="${session.userName != null}" class="btn btn-primary btn-sm no-underline">
                <i class="ph ph-folder-open"></i> Meus Documentos
            </a>
        </div>
    </div>

    <div class="max-w-2xl mx-auto py-8 px-6">
        <th:block th:replace="${content}" />
    </div>

</div>
</body>
</html>
