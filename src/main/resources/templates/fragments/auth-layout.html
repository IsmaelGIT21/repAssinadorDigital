<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Auth layout (centered card, no sidebar) -->
<body th:fragment="page(pageTitle, content)">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: { DEFAULT: '#E5A100', hover: '#CC8F00', light: '#FFF8E7' },
                dark: { DEFAULT: '#1a1a1a', light: '#2d2d2d', muted: '#4a4a4a' },
                surface: '#f5f5f0',
                border: '#e5e5e0',
            }
        }
    }
}
</script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<link th:href="@{/css/style.css}" rel="stylesheet">

<div class="flex justify-center items-center min-h-screen p-6 bg-surface">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-[420px]">
        <div class="text-center mb-8">
            <img th:src="@{/images/utfpr_logo.png}" alt="UTFPR" class="max-w-[160px] h-auto mx-auto">
            <span class="block text-xs text-primary font-semibold tracking-wider mt-2 uppercase">Assinador Digital</span>
        </div>
        <th:block th:replace="${content}" />
    </div>
</div>
</body>
</html>
