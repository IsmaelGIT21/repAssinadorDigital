<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Documento</title>
</head>
<th:block th:replace="~{fragments/layout :: page('Novo Documento', 'new-document', ~{::pageContent})}">
<div th:fragment="pageContent">

    <div th:replace="~{fragments/ui :: pageTitle('Novo Documento para Assinatura')}"></div>
    <div th:replace="~{fragments/ui :: alert('error', ${error})}"></div>

    <form method="POST" enctype="multipart/form-data" th:action="@{/documents}" id="documentForm">

        <div class="card">
            <h3 class="text-base font-semibold mb-3">1. Documento PDF</h3>
            <div class="form-field">
                <label for="arquivo" class="form-label">Arquivo PDF:</label>
                <input type="file" id="arquivo" name="arquivo" accept="application/pdf" required class="form-file" />
            </div>
        </div>

        <div class="card">
            <h3 class="text-base font-semibold mb-3">2. Assinantes</h3>

            <div class="form-field">
                <label class="flex items-center gap-2 cursor-pointer font-normal text-sm text-gray-600">
                    <input type="checkbox" name="includeSelf" id="includeSelf" class="w-auto accent-primary">
                    Me incluir como assinante
                    (<span th:text="${userName}">Usuario</span> - <span th:text="${userEmail}">email</span>)
                </label>
            </div>

            <div id="signersContainer">
                <div class="flex gap-3 items-end mb-3 max-md:flex-col max-md:items-stretch">
                    <div class="flex-1 form-field">
                        <label class="form-label">Nome:</label>
                        <input type="text" name="signerNames" placeholder="Nome do assinante" class="form-input">
                    </div>
                    <div class="flex-1 form-field">
                        <label class="form-label">Email:</label>
                        <input type="email" name="signerEmails" placeholder="email@exemplo.com" class="form-input">
                    </div>
                    <button type="button" class="btn btn-danger btn-sm" onclick="removeSigner(this)">X</button>
                </div>
            </div>
            <button type="button" onclick="addSigner()" class="btn btn-outline mt-2">+ Adicionar Assinante</button>
        </div>

        <div class="card">
            <h3 class="text-base font-semibold mb-3">3. Validade</h3>
            <div class="form-field">
                <label class="form-label">Prazo para assinatura:</label>
                <select name="expirationHours" id="expirationHours" class="form-input">
                    <option value="6">6 horas</option>
                    <option value="12">12 horas</option>
                    <option value="24">1 dia</option>
                    <option value="48">2 dias</option>
                    <option value="72">3 dias</option>
                    <option value="120">5 dias</option>
                    <option value="168">7 dias</option>
                    <option value="240">10 dias</option>
                    <option value="360">15 dias</option>
                    <option value="504">21 dias</option>
                    <option value="720" selected>30 dias</option>
                </select>
            </div>
            <p class="text-xs text-gray-400 mt-2">
                <i class="ph ph-info"></i> Após o prazo expirar, os arquivos ficarão disponíveis para download por mais 30 dias antes de serem removidos permanentemente.
            </p>
        </div>

        <div class="flex gap-3 flex-wrap max-md:flex-col">
            <button type="submit" class="btn btn-primary btn-lg" onclick="return validateForm()">Enviar e Solicitar Assinaturas</button>
            <a th:href="@{/documents}" class="btn btn-secondary btn-lg">Cancelar</a>
        </div>

    </form>

</div>
</th:block>

<script>
    function addSigner() {
        const container = document.getElementById('signersContainer');
        const row = document.createElement('div');
        row.className = 'flex gap-3 items-end mb-3 max-md:flex-col max-md:items-stretch';
        row.innerHTML = `
            <div class="flex-1 form-field">
                <label class="form-label">Nome:</label>
                <input type="text" name="signerNames" placeholder="Nome do assinante" class="form-input">
            </div>
            <div class="flex-1 form-field">
                <label class="form-label">Email:</label>
                <input type="email" name="signerEmails" placeholder="email@exemplo.com" class="form-input">
            </div>
            <button type="button" class="btn btn-danger btn-sm" onclick="removeSigner(this)">X</button>
        `;
        container.appendChild(row);
    }

    function removeSigner(btn) {
        const container = document.getElementById('signersContainer');
        if (container.children.length > 1) {
            btn.parentElement.remove();
        }
    }

    function validateForm() {
        const includeSelf = document.getElementById('includeSelf').checked;
        const emails = document.querySelectorAll('input[name="signerEmails"]');
        let hasExternalSigner = false;
        for (const input of emails) {
            if (input.value.trim() !== '') { hasExternalSigner = true; break; }
        }
        if (!includeSelf && !hasExternalSigner) {
            alert('Adicione pelo menos um assinante ou marque "Me incluir como assinante".');
            return false;
        }
        return true;
    }
</script>
</html>
