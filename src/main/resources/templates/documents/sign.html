<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinar Documento</title>
    <th:block th:replace="~{pdf/signature-stamp :: stampStyles}"></th:block>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" referrerpolicy="no-referrer"></script>
    <script>
        (function() {
            const pdfLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (pdfLib && pdfLib.GlobalWorkerOptions) {
                pdfLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
            }
        })();
    </script>
</head>
<th:block th:replace="~{fragments/layout :: page('Assinar Documento', 'documents', ~{::pageContent})}">
<div th:fragment="pageContent">

    <div th:replace="~{fragments/ui :: pageTitle('Assinar Documento')}"></div>
    <div th:replace="~{fragments/ui :: alert('error', ${error})}"></div>

    <div class="card">
        <p class="mb-4 text-gray-500 text-sm">Arraste o carimbo para a posicao desejada e clique em "Assinar".</p>

        <!-- Sign Form -->
        <form th:action="@{/sign/execute}" method="post" id="signForm">
            <input type="hidden" name="token" th:value="${token}" />
            <input type="hidden" name="stampX" id="stampX" value="40" />
            <input type="hidden" name="stampYFromBottom" id="stampYFromBottom" value="40" />
            <input type="hidden" name="pageNumber" id="pageNumber" value="1" />
            <div class="flex gap-3 mb-4">
                <button type="submit" class="btn btn-primary">Assinar Documento</button>
            </div>
        </form>

        <!-- Reject -->
        <form th:action="@{/sign/reject}" method="post" class="mb-6">
            <input type="hidden" name="token" th:value="${token}" />
            <details>
                <summary class="cursor-pointer text-red-600 text-sm">Recusar Assinatura</summary>
                <div class="mt-3">
                    <div class="form-field">
                        <label class="form-label">Motivo (opcional):</label>
                        <textarea name="reason" rows="2" placeholder="Informe o motivo da recusa..." class="form-input"></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Tem certeza que deseja recusar a assinatura?');">
                        Confirmar Recusa
                    </button>
                </div>
            </details>
        </form>

        <div id="pdfContainer" class="pdf-preview-wrapper">
            <canvas id="pdfCanvas"></canvas>
            <div th:replace="~{pdf/signature-stamp :: stamp('signatureOverlay', ${userName}, ${userEmail}, ${cpfMasked}, ${signDateTime}, ${documentHash}, '../images/utfpr_logo.png', 'signature-overlay--interactive', 220, 60, ${validatorURL})}"></div>
        </div>

        <div class="flex items-center gap-2 mt-4 justify-center" id="pageControls" hidden>
            <button type="button" class="page-nav-btn" id="prevPageBtn">&lt;</button>
            <span id="pageInfo" class="text-xs text-gray-400">1 / 1</span>
            <button type="button" class="page-nav-btn" id="nextPageBtn">&gt;</button>
        </div>
    </div>

</div>
</th:block>

<script>
    (function() {
        const form = document.getElementById('signForm');
        const overlay = document.getElementById('signatureOverlay');
        const canvas = document.getElementById('pdfCanvas');
        const hiddenX = document.getElementById('stampX');
        const hiddenYFromBottom = document.getElementById('stampYFromBottom');
        const hiddenPage = document.getElementById('pageNumber');
        const stampWidth = parseFloat(overlay.dataset.stampWidth || '220');
        const stampHeight = parseFloat(overlay.dataset.stampHeight || '60');
        const DEFAULT_SCALE = 4 / 3;

        let pdfDocument = null, currentPage = 1, pageViewport = null;
        let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;

        const pdfLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;

        const pdfUrl = 'preview/pdf?token=' + document.querySelector('[name="token"]').value;
        pdfLib.getDocument(pdfUrl).promise.then(function(pdf) {
            pdfDocument = pdf;
            document.getElementById('pageControls').hidden = false;
            renderPage(currentPage);
        });

        function renderPage(num) {
            pdfDocument.getPage(num).then(function(page) {
                pageViewport = page.getViewport({ scale: DEFAULT_SCALE });
                canvas.width = pageViewport.width;
                canvas.height = pageViewport.height;
                page.render({ canvasContext: canvas.getContext('2d'), viewport: pageViewport });
                document.getElementById('pageInfo').textContent = num + ' / ' + pdfDocument.numPages;
                overlay.style.width = (stampWidth * DEFAULT_SCALE) + 'px';
                overlay.style.height = (stampHeight * DEFAULT_SCALE) + 'px';
                overlay.style.position = 'absolute';
                overlay.style.cursor = 'grab';
                overlay.style.background = 'rgba(255,255,255,0.9)';
                if (!overlay.style.left || overlay.style.left === '0px') {
                    overlay.style.left = '40px';
                    overlay.style.top = (canvas.height - stampHeight * DEFAULT_SCALE - 40) + 'px';
                }
                updateHiddenFields();
            });
        }

        overlay.addEventListener('mousedown', function(e) {
            isDragging = true; dragOffsetX = e.clientX - overlay.getBoundingClientRect().left;
            dragOffsetY = e.clientY - overlay.getBoundingClientRect().top; overlay.style.cursor = 'grabbing'; e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            var container = document.getElementById('pdfContainer');
            var r = container.getBoundingClientRect();
            var originX = r.left + container.clientLeft;
            var originY = r.top + container.clientTop;
            var x = Math.max(0, Math.min(e.clientX - originX - dragOffsetX, canvas.width - overlay.offsetWidth));
            var y = Math.max(0, Math.min(e.clientY - originY - dragOffsetY, canvas.height - overlay.offsetHeight));
            overlay.style.left = x + 'px'; overlay.style.top = y + 'px'; updateHiddenFields();
        });
        document.addEventListener('mouseup', function() {
            if (isDragging) { isDragging = false; overlay.style.cursor = 'grab'; updateHiddenFields(); }
        });

        function updateHiddenFields() {
            if (!pageViewport) return;
            var pdfX = (parseFloat(overlay.style.left) || 0) / DEFAULT_SCALE;
            var pdfYFromTop = (parseFloat(overlay.style.top) || 0) / DEFAULT_SCALE;
            hiddenX.value = pdfX.toFixed(2);
            hiddenYFromBottom.value = (pageViewport.height / DEFAULT_SCALE - pdfYFromTop - stampHeight).toFixed(2);
            hiddenPage.value = currentPage;
        }

        document.getElementById('prevPageBtn').addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } });
        document.getElementById('nextPageBtn').addEventListener('click', function() { if (pdfDocument && currentPage < pdfDocument.numPages) { currentPage++; renderPage(currentPage); } });
    })();
</script>
</html>
