<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <style th:fragment="stampStyles">
        @page {
            size: 220pt 60pt;
            margin: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Helvetica, Arial, sans-serif;
            background: transparent;
        }

        .signature-overlay {
            display: table;
            width: 220pt;
            height: 60pt;
            box-sizing: border-box;
            padding: 3pt 5pt;
            color: #000000;
        }

        .signature-overlay-inner {
            display: table-cell;
            vertical-align: middle;
        }

        .signature-overlay-top {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .signature-overlay-logo,
        .signature-overlay-info {
            display: table-cell;
            vertical-align: middle;
        }

        .signature-overlay-logo {
            width: 64pt;
            text-align: center;
            height: 100%;
        }

        .signature-overlay-logo img {
            width: 60pt;
            display: inline-block;
            vertical-align: middle;
        }

        .signature-overlay-info {
            padding-left: 6pt;
        }

        .signature-overlay-name {
            font-size: 9pt;
            font-weight: bold;
            color: #CC8F00;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .signature-overlay-row {
            font-size: 7.5pt;
            color: #111111;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .signature-overlay-meta {
            font-size: 7pt;
            color: #222222;
            line-height: 1.2;
            margin-top: 2pt;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .signature-overlay-url {
            font-size: 6.5pt;
            color: #333333;
            line-height: 1.15;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div th:fragment="stamp(elementId, userName, userEmail, cpfMasked, signDateTime, documentHash, logoSrc, extraClasses, stampWidth, stampHeight, validatorURL)"
        th:id="${elementId} ?: 'signatureOverlay'"
        th:class="${'signature-overlay signature-overlay--rendered' + (extraClasses != null ? ' ' + extraClasses : '')}"
        th:attr="data-stamp-width=${stampWidth} ?: 220, data-stamp-height=${stampHeight} ?: 60">
        <div class="signature-overlay-inner">
            <div class="signature-overlay-top">
                <div class="signature-overlay-logo">
                    <img th:src="${logoSrc}" alt="Logo" />
                </div>
                <div class="signature-overlay-info">
                    <div class="signature-overlay-name" th:text="${userName} ?: 'Nome do usuário'">Nome do usuário</div>
                    <div class="signature-overlay-row" th:if="${cpfMasked}" th:text="'CPF: ' + ${cpfMasked}">CPF: ***.000.000-00</div>
                    <div class="signature-overlay-row" th:text="${userEmail} ?: 'email@dominio.com'">email@dominio.com</div>
                </div>
            </div>
            <div class="signature-overlay-meta"
                 th:text="${signDateTime} + (${documentHash} ? ' | Hash: ' + ${documentHash} : '')">
                01/01/2026 12:00:00 | Hash: abc123...
            </div>
            <div class="signature-overlay-url" th:if="${validatorURL}" th:text="'Validar em: ' + ${validatorURL}">Validar em: /validator</div>
        </div>
    </div>
</body>

</html>
