<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Assinaturas</title>
</head>
<th:block th:replace="~{fragments/public-layout :: page('Validador', ~{::pageContent})}">
<div th:fragment="pageContent">

    <h1 class="text-2xl font-bold mb-6">Validador de Assinaturas PDF</h1>

    <div class="card">
        <form method="POST" enctype="multipart/form-data" th:action="@{/validate-document}">
            <div class="form-field">
                <label for="arquivo" class="form-label">Selecione o PDF para validar:</label>
                <input type="file" id="arquivo" name="arquivo" accept="application/pdf" required class="form-file" />
            </div>
            <button type="submit" class="btn btn-primary btn-full">Verificar Assinaturas</button>
        </form>

        <div th:if="${result != null}">

            <div th:if="${result.signedByUs}" class="validation-result valid">
                <h3 class="text-lg font-semibold mt-2 flex items-center">
                    <span class="text-2xl text-green-500 mr-1"><i class="ph ph-check-circle"></i></span>
                    <span>Documento Autentico</span>
                </h3>
                <p class="text-sm mt-1">Este documento possui assinatura(s) digital(is) valida(s) emitida(s) pela nossa organizacao.</p>
            </div>

            <div th:if="${!result.signedByUs}" class="validation-result invalid">
                <span class="text-2xl text-red-500 mr-1"><i class="ph ph-x-circle"></i></span>
                <h3 class="text-lg font-semibold mt-2">Nenhuma Assinatura Valida</h3>
                <p class="text-sm mt-1">Nao foi possivel identificar nenhuma assinatura digital valida neste documento.</p>
            </div>

            <!-- Signature details -->
            <div th:if="${result.signatures != null && !result.signatures.isEmpty()}" class="mt-6">
                <h3 class="text-base font-semibold mb-3">Detalhes das Assinaturas</h3>
                <div th:each="sig : ${result.signatures}" class="card">
                    <div class="flex flex-col gap-2">
                        <div th:if="${sig.signerName}" th:replace="~{fragments/ui :: infoItem('Assinante', ${sig.signerName})}"></div>
                        <div th:if="${sig.signerCpf}" th:replace="~{fragments/ui :: infoItem('CPF', ${sig.signerCpf})}"></div>
                        <div th:if="${sig.signerEmail}" th:replace="~{fragments/ui :: infoItem('Email', ${sig.signerEmail})}"></div>
                        <div th:if="${sig.signedAt}" th:replace="~{fragments/ui :: infoItem('Data da assinatura', ${sig.signedAt})}"></div>
                        <div th:if="${sig.signatureReason}" th:replace="~{fragments/ui :: infoItem('Motivo', ${sig.signatureReason})}"></div>
                        <div class="info-item">
                            <label>Status:</label>
                            <span th:if="${sig.valid}" class="font-bold text-green-600">Valida</span>
                            <span th:unless="${sig.valid}" class="font-bold text-red-600">Invalida</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div th:replace="~{fragments/ui :: alert('error', ${error})}"></div>
    </div>

</div>
</th:block>
</html>
