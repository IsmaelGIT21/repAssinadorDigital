<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assinar PDF</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css" />

  </head>
  <body class="com-sidebar">
  	<button class="btn-burger" id="btnMenu" type="button" aria-label="Abrir menu">☰</button>
    <div class="sidebar-backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img th:src="@{/images/utfpr_logo.png}" src="/images/utfpr_logo.png" alt="UTFPR" />
        </div>
        <span class="sidebar-title">Assinador Digital</span>
      </div>

      <nav class="sidebar-nav">
        <a th:href="@{/sign-pdf}" href="/sign-pdf" class="sidebar-nav-item ativo">Assinar PDF</a>
        <a th:href="@{/sign-validate}" href="/sign-validate" class="sidebar-nav-item">Validar Assinatura</a>
      </nav>

      <div class="sidebar-footer">
        <span class="user-name" th:text="${#authentication != null ? #authentication.name : 'Usuário'}"></span>
        <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
          <button type="submit" class="btn-sair">Sair</button>
        </form>
      </div>
    </aside>
    
    <main class="conteudo">
      <div class="container-app">
    	<!-- Título da Seção -->
      <h1 class="page-title">Assinar PDF</h1>

      <!-- Card do Formulário -->
      <div class="card-app">
        <p class="helper-text">
          Atalho para assinar um PDF rapidamente: o documento será criado na sua
          conta com você como único assinante.
        </p>

        <div
          class="alert-error"
          id="erro"
          th:text="${erro}"
          th:hidden="${erro == null}"
        ></div>

        <!-- th:action faz o Thymeleaf incluir o token CSRF exigido pelo Spring Security -->
        <form
          id="form-envio"
          th:action="@{/sign-pdf}"
          method="POST"
          enctype="multipart/form-data"
          th:attr="data-tamanho-maximo=${tamanhoMaximoBytes},data-tamanho-maximo-mb=${tamanhoMaximoMb}"
        >
          <div class="form-group">
            <label class="form-label" for="pdf-file">Arquivo PDF:</label>
            <div class="file-upload-wrapper">
              <input
                type="file"
                id="pdf-file"
                name="pdf-file"
                accept="application/pdf,.pdf"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-submit">Assinar</button>
        </form>
      </div>
    </div>
    </main>

    <script>
    (function () {
        const btnMenu = document.getElementById("btnMenu");
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("backdrop");

        function alternarMenu() {
          sidebar.classList.toggle("aberta");
          backdrop.classList.toggle("visivel");
        }

        btnMenu.addEventListener("click", alternarMenu);
        backdrop.addEventListener("click", alternarMenu);
      })();
      // Validação antecipada; o servidor valida tudo novamente.
      (function () {
        const form = document.getElementById("form-envio");
        const campo = document.getElementById("pdf-file");
        const erro = document.getElementById("erro");
        const tamanhoMaximo = Number(form.dataset.tamanhoMaximo);

        function mostrarErro(mensagem) {
          erro.textContent = mensagem;
          erro.hidden = false;
        }

        form.addEventListener("submit", function (evento) {
          const arquivo = campo.files[0];
          if (!arquivo) {
            return;
          }
          const ehPdf =
            arquivo.type === "application/pdf" || /\.pdf$/i.test(arquivo.name);
          if (!ehPdf) {
            evento.preventDefault();
            mostrarErro("Selecione um arquivo PDF.");
          } else if (arquivo.size > tamanhoMaximo) {
            evento.preventDefault();
            mostrarErro(
              "O arquivo excede o tamanho máximo de " +
                form.dataset.tamanhoMaximoMb +
                " MB.",
            );
          } else {
            form.querySelector('button[type="submit"]').disabled = true;
          }
        });
      })();
    </script>
  </body>
</html>
