<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuario</title>
</head>
<th:block th:replace="~{fragments/auth-layout :: page('Login', ~{::pageContent})}">
<div th:fragment="pageContent">

    <h1 class="text-xl font-bold text-center mb-6">Login de Usuario</h1>

    <div th:replace="~{fragments/ui :: alert('success', ${success})}"></div>
    <div th:replace="~{fragments/ui :: alert('error', ${error})}"></div>

    <form th:action="@{/login}" th:object="${loginDTO}" method="post">
        <div class="form-field">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" th:field="*{email}" required class="form-input">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs mt-1 block font-medium"></span>
        </div>
        <div class="form-field">
            <label for="password" class="form-label">Senha:</label>
            <input type="password" id="password" th:field="*{password}" required class="form-input">
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1 block font-medium"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <p class="switch-text"><a th:href="@{/forgot-password}">Esqueci minha senha</a></p>
    <p class="switch-text">Nao tem uma conta? <a th:href="@{/register}">Cadastre-se</a></p>

</div>
</th:block>
</html>
