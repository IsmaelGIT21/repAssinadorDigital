<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuario</title>
</head>
<th:block th:replace="~{fragments/auth-layout :: page('Cadastro', ~{::pageContent})}">
<div th:fragment="pageContent">

    <h1 class="text-xl font-bold text-center mb-6">Cadastro de Usuario</h1>

    <div th:replace="~{fragments/ui :: alert('error', ${error})}"></div>

    <form th:action="@{/register}" th:object="${registrationDTO}" method="post">
        <div class="form-field">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" th:field="*{email}" placeholder="seu@email.com" required class="form-input">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs mt-1 block font-medium"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Cadastrar</button>
    </form>

    <p class="switch-text">Ja tem uma conta? <a th:href="@{/login}">Faca Login</a></p>
    <p class="help-text"><small>Voce recebera um email com um link para verificar sua conta.</small></p>

</div>
</th:block>
</html>
