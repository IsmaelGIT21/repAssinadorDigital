<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci Minha Senha</title>
</head>
<th:block th:replace="~{fragments/auth-layout :: page('Esqueci Minha Senha', ~{::pageContent})}">
<div th:fragment="pageContent">

    <h1 class="text-xl font-bold text-center mb-6">Esqueci Minha Senha</h1>

    <div th:replace="~{fragments/ui :: alert('error', ${error})}"></div>

    <p class="text-sm text-gray-500 mb-4">Informe seu email para receber um link de redefinicao de senha.</p>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-field">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required class="form-input">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Enviar Link</button>
    </form>

    <p class="switch-text">Lembrou a senha? <a th:href="@{/login}">Voltar ao Login</a></p>

</div>
</th:block>
</html>
