<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
</head>
<th:block th:replace="~{fragments/auth-layout :: page('Redefinir Senha', ~{::pageContent})}">
<div th:fragment="pageContent">

    <h1 class="text-xl font-bold text-center mb-6">Redefinir Senha</h1>

    <div th:replace="~{fragments/ui :: alert('error', ${error})}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="form-field">
            <label for="password" class="form-label">Nova Senha:</label>
            <input type="password" id="password" name="password" placeholder="Minimo 8 caracteres" required minlength="8" class="form-input">
        </div>
        <div class="form-field">
            <label for="confirmPassword" class="form-label">Confirme a Senha:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Digite a senha novamente" required class="form-input">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Redefinir Senha</button>
    </form>

    <p class="switch-text"><a th:href="@{/login}">Voltar ao Login</a></p>

</div>
</th:block>
</html>
