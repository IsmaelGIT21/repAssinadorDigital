<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Assinador Digital UTFPR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/login.css}"
      href="../static/css/login.css"
    />
  </head>
  <body>
    <main class="moldura">
      <span class="marca marca--se" aria-hidden="true"></span>
      <span class="marca marca--sd" aria-hidden="true"></span>
      <span class="marca marca--ie" aria-hidden="true"></span>
      <span class="marca marca--id" aria-hidden="true"></span>

      <div class="cartao">
        <header class="cabecalho">
          <img
            class="logo"
            th:src="@{/images/utfpr_logo.png}"
            src="/images/utfpr_logo.png"
            alt="UTFPR - Universidade Tecnológica Federal do Paraná"
            width="176"
            height="70"
          />
          <p class="produto">Assinador Digital</p>

          <div class="divisor" aria-hidden="true"></div>

          <h1 class="titulo">Entrar</h1>
          <p class="subtitulo">Acesse sua conta para assinar seus PDFs.</p>
        </header>

        <div class="aviso aviso--erro" role="alert" th:if="${falhouLogin}">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span
            >E-mail ou senha incorretos. Confira os dados e tente
            novamente.</span
          >
        </div>

        <div class="aviso aviso--sucesso" role="status" th:if="${saiu}">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          <span>Você saiu da sua conta.</span>
        </div>

        <form
          id="form-login"
          class="formulario"
          th:action="@{/login}"
          method="POST"
        >
          <div>
            <label class="rotulo" for="username">E-mail</label>
            <div class="campo">
              <svg
                class="icone"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
              <input
                class="entrada"
                type="email"
                id="username"
                name="username"
                placeholder="nome@utfpr.edu.br"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
                autofocus
                th:attr="aria-invalid=${falhouLogin}"
              />
            </div>
          </div>

          <div>
            <label class="rotulo" for="password">Senha</label>
            <div class="campo">
              <svg
                class="icone"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                class="entrada entrada--senha"
                type="password"
                id="password"
                name="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
                th:attr="aria-invalid=${falhouLogin}"
              />
              <button
                type="button"
                class="alternar-senha"
                id="alternar-senha"
                aria-label="Mostrar senha"
                aria-pressed="false"
                aria-controls="password"
              >
                <svg
                  class="icone-mostrar"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="icone-ocultar"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                  <path
                    d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
                  />
                  <path
                    d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
                  />
                  <line x1="2" y1="2" x2="22" y2="22" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="botao" id="botao-entrar">
            <span class="texto-botao">Entrar</span>
            <svg
              class="seta"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
            <span class="carregando" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </main>

    <p class="rodape">Universidade Tecnológica Federal do Paraná</p>

    <script>
      (function () {
        const senha = document.getElementById("password");
        const alternar = document.getElementById("alternar-senha");
        const form = document.getElementById("form-login");
        const botao = document.getElementById("botao-entrar");

        alternar.addEventListener("click", function () {
          const visivel = senha.type === "password";
          senha.type = visivel ? "text" : "password";
          alternar.setAttribute("aria-pressed", String(visivel));
          alternar.setAttribute(
            "aria-label",
            visivel ? "Ocultar senha" : "Mostrar senha",
          );
          senha.focus();
        });

        form.addEventListener("submit", function () {
          botao.disabled = true;
          botao.classList.add("enviando");
          botao.querySelector(".texto-botao").textContent = "Entrando…";
        });

        window.addEventListener("pageshow", function () {
          botao.disabled = false;
          botao.classList.remove("enviando");
          botao.querySelector(".texto-botao").textContent = "Entrar";
        });
      })();
    </script>
  </body>
</html>
